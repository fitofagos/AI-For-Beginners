<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="ledGlow2" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff8a80"/>
      <stop offset="60%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </radialGradient>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9800"/>
    </marker>
  </defs>

  <rect width="1000" height="700" fill="#fdfdfd" stroke="#dddddd"/>
  <text x="500" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#263238">Blink circuit — connecting one LED to an Arduino Uno</text>
  <text x="500" y="66" text-anchor="middle" font-size="15" fill="#607d8b">Follow steps ① → ④ · only 4 connections are needed</text>

  <!-- ================= ARDUINO UNO ================= -->
  <g>
    <rect x="60" y="230" width="330" height="340" rx="14" fill="#00878F" stroke="#005f66" stroke-width="3"/>
    <!-- USB port -->
    <rect x="38" y="262" width="42" height="64" rx="4" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
    <text x="59" y="345" text-anchor="middle" font-size="11" fill="#eceff1">USB</text>
    <!-- power jack -->
    <rect x="38" y="470" width="42" height="52" rx="4" fill="#263238"/>
    <!-- microcontroller chip -->
    <rect x="180" y="410" width="160" height="52" rx="4" fill="#212121"/>
    <text x="260" y="441" text-anchor="middle" font-size="11" fill="#9e9e9e">ATmega328P</text>
    <text x="225" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">ARDUINO</text>
    <text x="225" y="388" text-anchor="middle" font-size="14" fill="#b2ebf2">UNO</text>

    <!-- digital pin header -->
    <rect x="110" y="235" width="270" height="28" rx="3" fill="#1a1a1a"/>
    <!-- pin holes -->
    <g fill="#ffd54f">
      <rect x="145" y="241" width="10" height="10"/>
      <rect x="175" y="241" width="10" height="10"/>
      <rect x="205" y="241" width="10" height="10"/>
      <rect x="235" y="241" width="10" height="10"/>
      <rect x="265" y="241" width="10" height="10"/>
      <rect x="295" y="241" width="10" height="10"/>
      <rect x="325" y="241" width="10" height="10"/>
      <rect x="355" y="241" width="10" height="10"/>
    </g>
    <!-- pin labels -->
    <g fill="#ffffff" font-size="11" text-anchor="middle">
      <text x="150" y="280" font-weight="bold">GND</text>
      <text x="180" y="280" font-weight="bold">13</text>
      <text x="210" y="280">12</text>
      <text x="240" y="280">11</text>
      <text x="270" y="280">10</text>
      <text x="300" y="280">9</text>
      <text x="330" y="280">8</text>
      <text x="360" y="280">7</text>
    </g>
  </g>

  <!-- ================= BREADBOARD ================= -->
  <g>
    <rect x="540" y="180" width="400" height="300" rx="10" fill="#f5f5f0" stroke="#bdbdbd" stroke-width="3"/>
    <!-- hole grid -->
    <g fill="#cfd8dc">
      <g id="holeRow">
        <circle cx="570" cy="210" r="3"/><circle cx="600" cy="210" r="3"/><circle cx="630" cy="210" r="3"/><circle cx="660" cy="210" r="3"/><circle cx="690" cy="210" r="3"/><circle cx="720" cy="210" r="3"/><circle cx="750" cy="210" r="3"/><circle cx="780" cy="210" r="3"/><circle cx="810" cy="210" r="3"/><circle cx="840" cy="210" r="3"/><circle cx="870" cy="210" r="3"/><circle cx="900" cy="210" r="3"/>
      </g>
      <use href="#holeRow" y="40"/>
      <use href="#holeRow" y="80"/>
      <use href="#holeRow" y="122"/>
      <use href="#holeRow" y="148"/>
      <use href="#holeRow" y="190"/>
      <use href="#holeRow" y="230"/>
    </g>
    <text x="740" y="472" text-anchor="middle" font-size="12" fill="#90a4ae">breadboard</text>

    <!-- highlighted connected row -->
    <rect x="560" y="324" width="130" height="16" rx="8" fill="#a5d6a7" opacity="0.65"/>
    <text x="660" y="375" text-anchor="middle" font-size="12" fill="#2e7d32" font-style="italic">holes in the same row are</text>
    <text x="660" y="390" text-anchor="middle" font-size="12" fill="#2e7d32" font-style="italic">connected inside the breadboard</text>
    <line x1="640" y1="345" x2="650" y2="362" stroke="#2e7d32" stroke-width="1.5"/>
  </g>

  <!-- ================= RED JUMPER: pin 13 -> resistor ================= -->
  <polyline points="180,240 180,150 590,150 590,212" fill="none" stroke="#e53935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ================= RESISTOR (vertical) ================= -->
  <g>
    <line x1="590" y1="212" x2="590" y2="244" stroke="#9e9e9e" stroke-width="4"/>
    <rect x="578" y="244" width="24" height="58" rx="10" fill="#efdcb1" stroke="#bca06a" stroke-width="2"/>
    <rect x="578" y="254" width="24" height="7" fill="#e53935"/>
    <rect x="578" y="267" width="24" height="7" fill="#e53935"/>
    <rect x="578" y="280" width="24" height="7" fill="#6d4c41"/>
    <line x1="590" y1="302" x2="590" y2="332" stroke="#9e9e9e" stroke-width="4"/>
  </g>

  <!-- ================= LED on breadboard ================= -->
  <g>
    <!-- legs first (behind body) -->
    <line x1="676" y1="296" x2="676" y2="332" stroke="#9e9e9e" stroke-width="5"/> <!-- anode long -->
    <line x1="704" y1="296" x2="704" y2="358" stroke="#9e9e9e" stroke-width="5"/> <!-- cathode -->
    <!-- body -->
    <path d="M 662 250 A 28 28 0 0 1 718 250 L 718 292 L 662 292 Z" fill="url(#ledGlow2)" stroke="#8e0000" stroke-width="2"/>
    <rect x="657" y="292" width="66" height="8" rx="3" fill="#c62828" stroke="#8e0000"/>
    <!-- glow rays -->
    <g stroke="#ffb300" stroke-width="2.5" stroke-linecap="round">
      <line x1="690" y1="215" x2="690" y2="200"/>
      <line x1="665" y1="223" x2="655" y2="211"/>
      <line x1="715" y1="223" x2="725" y2="211"/>
    </g>
    <text x="672" y="318" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">+</text>
    <text x="712" y="350" font-size="12" font-weight="bold" fill="#c62828">−</text>
  </g>

  <!-- ================= BLACK JUMPER: cathode -> GND ================= -->
  <polyline points="704,358 704,510 150,510 150,262" fill="none" stroke="#212121" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
  <polyline points="704,358 704,510 150,510 150,262" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="1 10" opacity="0.0"/>

  <!-- ================= CURRENT FLOW ARROWS ================= -->
  <g stroke="#ff9800" stroke-width="2.5" fill="none">
    <line x1="300" y1="150" x2="340" y2="150" marker-end="url(#flowArrow)"/>
    <line x1="590" y1="170" x2="590" y2="195" marker-end="url(#flowArrow)"/>
    <line x1="704" y1="410" x2="704" y2="440" marker-end="url(#flowArrow)"/>
    <line x1="430" y1="510" x2="390" y2="510" marker-end="url(#flowArrow)"/>
  </g>
  <text x="320" y="135" text-anchor="middle" font-size="12" fill="#ef6c00" font-style="italic">current flows this way</text>

  <!-- ================= STEP LABELS ================= -->
  <g font-size="15" fill="#263238">
    <!-- step 1 -->
    <circle cx="450" cy="110" r="14" fill="#e53935"/>
    <text x="450" y="115" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
    <text x="472" y="106" font-weight="bold">Red wire</text>
    <text x="472" y="124">from pin 13 to the resistor</text>

    <!-- step 2 -->
    <circle cx="425" cy="300" r="14" fill="#f9a825"/>
    <text x="425" y="305" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
    <text x="447" y="296" font-weight="bold">Resistor 220 Ω</text>
    <text x="447" y="314">protects the LED</text>
    <line x1="548" y1="290" x2="574" y2="278" stroke="#f9a825" stroke-width="1.5"/>

    <!-- step 3 -->
    <circle cx="775" cy="265" r="14" fill="#2e7d32"/>
    <text x="775" y="270" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
    <text x="797" y="255" font-weight="bold">LED</text>
    <text x="797" y="274">long leg (+) in the same</text>
    <text x="797" y="292">row as the resistor</text>

    <!-- step 4 -->
    <circle cx="450" cy="540" r="14" fill="#212121"/>
    <text x="450" y="545" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
    <text x="472" y="536" font-weight="bold">Black wire</text>
    <text x="472" y="554">from the short leg (−) back to GND</text>
  </g>

  <!-- ================= WARNING BOX ================= -->
  <rect x="610" y="568" width="330" height="78" rx="10" fill="#ffebee" stroke="#e53935" stroke-width="2"/>
  <text x="775" y="596" text-anchor="middle" font-size="15" font-weight="bold" fill="#c62828">⚠ Never skip the resistor!</text>
  <text x="775" y="618" text-anchor="middle" font-size="13" fill="#5d4037">Without it, too much current flows and</text>
  <text x="775" y="635" text-anchor="middle" font-size="13" fill="#5d4037">the LED (or the Arduino pin) can burn out.</text>

  <!-- footer path summary -->
  <text x="500" y="682" text-anchor="middle" font-size="15" fill="#37474f" font-weight="bold">Pin 13 ➜ resistor ➜ LED (+ long leg) ➜ LED (− short leg) ➜ GND</text>
</svg>
