<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="ledLit" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffcdd2"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#c62828"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="620" fill="#fdfdfd" stroke="#dddddd"/>
  <text x="500" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#263238">LumaNode in action — the blink circuit, animated</text>
  <text x="500" y="64" text-anchor="middle" font-size="15" fill="#607d8b">Pin 13 switches between 5 V (HIGH) and 0 V (LOW) every second</text>

  <!-- ================= ARDUINO UNO ================= -->
  <g>
    <rect x="60" y="230" width="330" height="340" rx="14" fill="#00878F" stroke="#005f66" stroke-width="3"/>
    <rect x="38" y="262" width="42" height="64" rx="4" fill="#b0bec5" stroke="#78909c" stroke-width="2"/>
    <text x="59" y="345" text-anchor="middle" font-size="11" fill="#eceff1">USB</text>
    <rect x="38" y="470" width="42" height="52" rx="4" fill="#263238"/>
    <rect x="180" y="410" width="160" height="52" rx="4" fill="#212121"/>
    <text x="260" y="441" text-anchor="middle" font-size="11" fill="#9e9e9e">ATmega328P</text>
    <text x="225" y="365" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">ARDUINO</text>
    <text x="225" y="388" text-anchor="middle" font-size="14" fill="#b2ebf2">UNO</text>

    <rect x="110" y="235" width="270" height="28" rx="3" fill="#1a1a1a"/>
    <g fill="#ffd54f">
      <rect x="145" y="241" width="10" height="10"/>
      <rect x="175" y="241" width="10" height="10"/>
      <rect x="205" y="241" width="10" height="10"/>
      <rect x="235" y="241" width="10" height="10"/>
      <rect x="265" y="241" width="10" height="10"/>
      <rect x="295" y="241" width="10" height="10"/>
      <rect x="325" y="241" width="10" height="10"/>
      <rect x="355" y="241" width="10" height="10"/>
    </g>
    <g fill="#ffffff" font-size="11" text-anchor="middle">
      <text x="150" y="280" font-weight="bold">GND</text>
      <text x="180" y="280" font-weight="bold">13</text>
      <text x="210" y="280">12</text>
      <text x="240" y="280">11</text>
      <text x="270" y="280">10</text>
      <text x="300" y="280">9</text>
      <text x="330" y="280">8</text>
      <text x="360" y="280">7</text>
    </g>
  </g>

  <!-- ================= BREADBOARD ================= -->
  <g>
    <rect x="540" y="180" width="400" height="300" rx="10" fill="#f5f5f0" stroke="#bdbdbd" stroke-width="3"/>
    <g fill="#cfd8dc">
      <g id="holeRowA">
        <circle cx="570" cy="210" r="3"/><circle cx="600" cy="210" r="3"/><circle cx="630" cy="210" r="3"/><circle cx="660" cy="210" r="3"/><circle cx="690" cy="210" r="3"/><circle cx="720" cy="210" r="3"/><circle cx="750" cy="210" r="3"/><circle cx="780" cy="210" r="3"/><circle cx="810" cy="210" r="3"/><circle cx="840" cy="210" r="3"/><circle cx="870" cy="210" r="3"/><circle cx="900" cy="210" r="3"/>
      </g>
      <use href="#holeRowA" y="40"/>
      <use href="#holeRowA" y="80"/>
      <use href="#holeRowA" y="122"/>
      <use href="#holeRowA" y="148"/>
      <use href="#holeRowA" y="190"/>
      <use href="#holeRowA" y="230"/>
    </g>
    <text x="740" y="472" text-anchor="middle" font-size="12" fill="#90a4ae">breadboard</text>
    <rect x="560" y="324" width="130" height="16" rx="8" fill="#a5d6a7" opacity="0.5"/>
  </g>

  <!-- ================= WIRES ================= -->
  <polyline points="180,240 180,150 590,150 590,212" fill="none" stroke="#e53935" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="704,358 704,510 150,510 150,262" fill="none" stroke="#212121" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- ================= RESISTOR ================= -->
  <g>
    <line x1="590" y1="212" x2="590" y2="244" stroke="#9e9e9e" stroke-width="4"/>
    <rect x="578" y="244" width="24" height="58" rx="10" fill="#efdcb1" stroke="#bca06a" stroke-width="2"/>
    <rect x="578" y="254" width="24" height="7" fill="#e53935"/>
    <rect x="578" y="267" width="24" height="7" fill="#e53935"/>
    <rect x="578" y="280" width="24" height="7" fill="#6d4c41"/>
    <line x1="590" y1="302" x2="590" y2="332" stroke="#9e9e9e" stroke-width="4"/>
  </g>

  <!-- ================= LED ================= -->
  <g>
    <!-- legs -->
    <line x1="676" y1="296" x2="676" y2="332" stroke="#9e9e9e" stroke-width="5"/>
    <line x1="704" y1="296" x2="704" y2="358" stroke="#9e9e9e" stroke-width="5"/>
    <!-- dark (off) body, always present underneath -->
    <path d="M 662 250 A 28 28 0 0 1 718 250 L 718 292 L 662 292 Z" fill="#8a2222" stroke="#5d1010" stroke-width="2"/>
    <rect x="657" y="292" width="66" height="8" rx="3" fill="#7f1d1d" stroke="#5d1010"/>
    <text x="668" y="318" text-anchor="end" font-size="12" font-weight="bold" fill="#2e7d32">+</text>
    <text x="712" y="350" font-size="12" font-weight="bold" fill="#c62828">−</text>

    <!-- lit overlay: fades with the 2 s blink cycle -->
    <g id="lit">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
      <circle cx="690" cy="262" r="52" fill="#ffb74d" opacity="0.35"/>
      <path d="M 662 250 A 28 28 0 0 1 718 250 L 718 292 L 662 292 Z" fill="url(#ledLit)" stroke="#8e0000" stroke-width="2"/>
      <rect x="657" y="292" width="66" height="8" rx="3" fill="#c62828" stroke="#8e0000"/>
      <g stroke="#ffb300" stroke-width="3" stroke-linecap="round">
        <line x1="690" y1="212" x2="690" y2="194"/>
        <line x1="662" y1="221" x2="650" y2="207"/>
        <line x1="718" y1="221" x2="730" y2="207"/>
        <line x1="648" y1="248" x2="630" y2="244"/>
        <line x1="732" y1="248" x2="750" y2="244"/>
      </g>
    </g>
  </g>

  <!-- ================= CURRENT DOTS ================= -->
  <!-- each dot travels the full loop; all dots hide while pin 13 is LOW -->
  <g id="dots" fill="#ff9800" stroke="#e65100" stroke-width="1">
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="0s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-0.5s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-1s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-1.5s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-2s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-2.5s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-3s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="6">
      <animateMotion dur="4s" repeatCount="indefinite" begin="-3.5s" path="M 180 245 L 180 150 L 590 150 L 590 330 L 676 330 L 676 290 L 704 290 L 704 358 L 704 510 L 152 510 L 152 260"/>
      <animate attributeName="opacity" values="0.95;0.95;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= STATE LABEL ================= -->
  <g font-size="17" font-weight="bold" text-anchor="middle">
    <text id="stateOn" x="385" y="125" fill="#2e7d32">pin 13 = HIGH (5 V) → current flows → LED is ON
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
    <text id="stateOff" x="385" y="125" fill="#90a4ae">pin 13 = LOW (0 V) → no current → LED is OFF
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- ================= CODE PANEL ================= -->
  <g font-family="Consolas, Menlo, monospace" font-size="16">
    <rect x="600" y="500" width="345" height="100" rx="10" fill="#263238"/>
    <text x="618" y="525" fill="#90a4ae" font-size="12">// inside loop()</text>
    <rect id="hlHigh" x="610" y="535" width="325" height="24" rx="4" fill="#fff176" opacity="0.25">
      <animate attributeName="opacity" values="0.3;0.3;0;0" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="618" y="553" fill="#a5d6a7">digitalWrite(13, HIGH);</text>
    <rect id="hlLow" x="610" y="565" width="325" height="24" rx="4" fill="#fff176" opacity="0">
      <animate attributeName="opacity" values="0;0;0.3;0.3" keyTimes="0;0.5;0.5;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="618" y="583" fill="#ef9a9a">digitalWrite(13, LOW);</text>
  </g>

  <text x="305" y="600" text-anchor="middle" font-size="14" fill="#607d8b" font-style="italic">1 second on · 1 second off — that is all "Blink" does!</text>
</svg>
